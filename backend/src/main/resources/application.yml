spring:
  application:
    name: selah-finance-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/selah_finance}
    username: ${DB_USER:selah}
    password: ${DB_PASSWORD:selah}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway es el dueño del esquema; Hibernate solo valida
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info

selah:
  zona-horaria: ${SELAH_ZONA_HORARIA:America/Lima}
  seguridad:
    jwt-secret: ${JWT_SECRET}
    jwt-expiracion: ${JWT_EXPIRACION:PT2H}
    jwt-emisor: selah-finance
    cors-origenes: ${CORS_ORIGENES:http://localhost:[*]}
  # Primer administrador (opcional). Debe cambiar la contraseña al ingresar.
  admin:
    email: ${SELAH_ADMIN_EMAIL:}
    password: ${SELAH_ADMIN_PASSWORD:}
    nombres: ${SELAH_ADMIN_NOMBRES:Administrador}
  # Con menos hermanos con datos que este mínimo, el pastor no ve promedios (evita identificar personas)
  congregacion:
    minimo-anonimato: ${SELAH_MINIMO_ANONIMATO:3}
  integraciones:
    clave-cifrado: ${SELAH_CLAVE_CIFRADO:}   # cifra los secretos de webhook; obligatoria para crear webhooks
  webhooks:
    intervalo-ms: ${SELAH_WEBHOOKS_INTERVALO_MS:15000}
    permitir-red-local: ${SELAH_WEBHOOKS_RED_LOCAL:false}
  reportes:
    cron: "0 30 3 * * *"
